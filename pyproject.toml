[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyreview"
version = "0.1.0"
description = "Multi-agent cross-review panel: let any CLI agents (codex/claude/kimi/...) review your specs & code against each other"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "code-review", "llm", "multi-agent", "cross-review", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["mcp>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
polyreview = "polyreview.cli:main"

[tool.setuptools.packages.find]
include = ["polyreview*"]
